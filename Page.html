<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sample HTML Page</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .text-primary-black {
            text-align: center;
            font-size: 50px;
        }
        .text {
            font-size: 30px;
        }
        .input-submit {
            
            background-color: saddlebrown;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    body {
        background-color: lightgray;
    }
    </style>
    <title>Document</title>
</head>
<body>
    <h1 class="text-primary-black">Hello World</h1>
    <p class="text">This is a sample HTML page.</p>
    <div>
    <field class ="field">
        <legend class="text">Sample Form</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <input class ="input-submit" type="submit" value="Submit">
    </div>
    <div>
    <table class="table table-hover table-striped">
        <thead>
            <tr>
                <th class="table-light">#</th>
                <th class="table-light">First</th>
                <th class="table-light">Last</th>
                <th class="table-light">Handle</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th class="table-light">1</th>
                <td>Mark</td>
                <td>Otto</td>
                <td>@mdo</td>
            </tr>
            <tr>
                <th class="table-light">2</th>
                <td>Jacob</td>
                <td>Thornton</td>
                <td>@fat</td>
            </tr>
            <tr>
                <th class="table-light">3</th>
                <td colspan="2">Larry the Bird</td>
                <td>@twitter</td>
            </tr>
        </tbody>
    </table>
    </div>
</body>
 </html>
